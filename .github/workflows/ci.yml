name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: pytest (no model download)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lightweight test stack
        # Unit tests mock MiniLM / dense encoders and never touch ISOT CSVs.
        # Install package metadata without pulling torch or sentence-transformers.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy>=1.24,<3" \
            "pandas>=2.0,<3" \
            "scikit-learn>=1.3,<2" \
            "scipy>=1.11,<2" \
            "pyarrow>=14,<20" \
            "joblib>=1.3,<2" \
            "pytest>=7.4,<9"
          pip install -e . --no-deps

      - name: Run unit tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest
